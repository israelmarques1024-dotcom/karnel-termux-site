name: Site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: israelmarques1024-dotcom/karnel-termux
          ref: c96aa5d6ec5c7723868520444c279a1da3b7b1bc
          path: .ci/karnel-termux
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: KARNEL_REPO_DIR="$GITHUB_WORKSPACE/.ci/karnel-termux" pnpm catalog:check
      - run: pnpm format:check
      - run: pnpm check
